name: Deploy OMP

on:
  push:
    branches:
      - main

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Execute Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            cd ~/domains/pusdipol.com/public_html/buku
            
            # Jika folder bukan git, inisialisasi dari awal agar tidak bentrok dengan file yang sudah diupload manual.
            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://github.com/Pusdipol/omp.git
            fi
            git fetch --all
            git reset --hard origin/main
            git clean -fd
            
            # Gunakan konfigurasi Hostinger secara otomatis
            if [ -f "config.hostinger.inc.php" ]; then
              cp config.hostinger.inc.php config.inc.php
            fi
            
            # Pastikan folder penting ada dan memiliki hak akses (menghindari HTTP ERROR 500)
            mkdir -p cache/t_cache cache/t_compile cache/t_config cache/_db public
            chmod -R 775 cache public
            
            # Install/Update dependencies PHP jika ada perubahan
            cd lib/pkp
            composer install --no-dev --optimize-autoloader
            
            # Kosongkan template cache agar perubahan langsung terlihat
            cd ../../
            php tools/clearTemplateCache.php || true
